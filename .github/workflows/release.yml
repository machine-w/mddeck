# Release — builds native CLI binaries on push of a v* tag and attaches
# them to a GitHub Release.
#
# Produces:
#   * mddeck-<tag>-linux-x64.AppImage
#   * mddeck-<tag>-macos-arm64.dmg     (Apple Silicon, ad-hoc signed)
#   * mddeck-<tag>-macos-x64.dmg       (Intel, ad-hoc signed)
#   * mddeck-<tag>-windows-x64-setup.exe
#
# The macOS .dmg files are ad-hoc signed (`codesign --sign -`). First launch
# on macOS will be blocked by "unidentified developer" — README documents the
# right-click → Open workaround. Notarization is intentionally out of scope.
#
# macOS runners use `macos-15` (Apple Silicon) and `macos-15-intel` (Intel).
# `macos-13` was retired Dec 2025; Intel x86_64 macOS runners will be retired
# ~Aug 2027 — drop the x64 job then.

name: Release

on:
  push:
    tags: ['v*']

# Cancel in-progress runs of the same workflow when a new tag is pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: yarn build

      - name: Compile binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p build
          # Strip the leading "v" from the tag (e.g. "v0.1.8" -> "0.1.8") for the
          # version constant baked into the binary's --version output.
          VER="${TAG#v}"
          bun build --compile \
            --minify --bytecode \
            --target=bun-linux-x64 \
            --define "process.env.MDDECK_VERSION=\"$VER\"" \
            packages/cli/bin/mddeck.js \
            --outfile build/mddeck
          chmod +x build/mddeck

      - name: Stage AppDir
        run: |
          cp build/mddeck packaging/linux/AppDir/mddeck
          chmod +x packaging/linux/AppDir/mddeck
          chmod +x packaging/linux/AppDir/AppRun

      - name: Download appimagetool
        run: |
          mkdir -p /tmp/appimagetool && cd /tmp/appimagetool
          curl -fsSL -o appimagetool \
            https://github.com/probonopd/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd packaging/linux
          /tmp/appimagetool/appimagetool \
            --appimage-extract-and-run \
            AppDir/ \
            "mddeck-${TAG}-linux-x64.AppImage"
          ls -la *.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: mddeck-linux-x64
          path: packaging/linux/*.AppImage
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS arm64 .dmg
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install create-dmg
        run: brew install create-dmg

      - run: bun install
      - run: yarn build

      - name: Compile binary
        run: |
          mkdir -p build
          VER="${TAG#v}"
          bun build --compile \
            --minify --bytecode \
            --target=bun-darwin-arm64 \
            --define "process.env.MDDECK_VERSION=\"$VER\"" \
            packages/cli/bin/mddeck.js \
            --outfile build/mddeck
          chmod +x build/mddeck

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/mddeck

      - name: Verify signature
        run: codesign -dv build/mddeck 2>&1 | grep -q "Signature=adhoc"

      - name: Build .dmg
        run: bash packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mddeck-macos-arm64
          path: packaging/macos/*.dmg
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS x64 .dmg
    runs-on: macos-15-intel
    env:
      TAG: ${{ github.ref_name }}
      ARCH: x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install create-dmg
        run: brew install create-dmg

      - run: bun install
      - run: yarn build

      - name: Compile binary
        run: |
          mkdir -p build
          VER="${TAG#v}"
          bun build --compile \
            --minify --bytecode \
            --target=bun-darwin-x64 \
            --define "process.env.MDDECK_VERSION=\"$VER\"" \
            packages/cli/bin/mddeck.js \
            --outfile build/mddeck
          chmod +x build/mddeck

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/mddeck

      - name: Verify signature
        run: codesign -dv build/mddeck 2>&1 | grep -q "Signature=adhoc"

      - name: Build .dmg
        run: bash packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mddeck-macos-x64
          path: packaging/macos/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - run: bun install
      - run: yarn build

      - name: Compile binary
        shell: bash
        run: |
          VER="${TAG#v}"
          bun build --compile \
            --minify --bytecode \
            --target=bun-windows-x64 \
            --define "process.env.MDDECK_VERSION=\"$VER\"" \
            packages/cli/bin/mddeck.js \
            --outfile build/mddeck.exe

      - name: Build installer
        shell: bash
        run: |
          # Strip the leading "v" from the tag (e.g. "v0.1.8" -> "0.1.8") for the
          # version constant Inno Setup substitutes into the output filename.
          VER="${TAG#v}"
          iscc /DMyAppVersion="$VER" packaging/windows/installer.iss
          mkdir -p packaging/windows
          mv mddeck-*-windows-x64-setup.exe packaging/windows/ || true
          ls -la packaging/windows/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: mddeck-windows-x64
          path: packaging/windows/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-macos-arm64
      - build-macos-x64
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/mddeck-linux-x64/*.AppImage
            artifacts/mddeck-macos-arm64/*.dmg
            artifacts/mddeck-macos-x64/*.dmg
            artifacts/mddeck-windows-x64/*-setup.exe