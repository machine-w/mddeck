**Please use [GitHub Discussions](https://github.com/machine-w/mddeck/discussions)
for questions and general discussion.**

This issue tracker is reserved for **bug reports** and **feature requests**.
For usage questions, troubleshooting help, or community chat, please open
a discussion instead — you'll get a faster response there and it keeps
the issue tracker clean for actionable items.
